name: blog
description: สร้างบล็อก
type: doc
stack: note

folders:
  - posts
  - posts/drafts
  - assets
  - assets/images

files:
  - path: posts/hello.md
    content: |
      # Hello World
      บทความแรกของ NAME

      วันที่: CREATED

  - path: posts/drafts/.gitkeep
    content: ""

  - path: README.md
    content: |
      # NAME
      บล็อกส่วนตัว

  - path: meta.json
    content: |
      {
        "name": "NAME",
        "type": "TYPE",
        "created": "CREATED"
      }
