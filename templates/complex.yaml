name: complex
description: สร้างโปรเจคโครงสร้างลึก 10 ชั้น พร้อมไฟล์ token replacement
type: work
stack: generic

folders:
  - src
  - src/lib
  - src/lib/utils
  - src/data
  - docs
  - docs/reference
  - configs
  - configs/production
  - configs/development
  - scripts
  - scripts/deploy

files:
  - path: src/main.rs
    content: |
      fn main() {
        println!("Hello from NAME!");
      }

  - path: src/lib/mod.rs
    content: |
      pub mod utils;

  - path: src/lib/utils/mod.rs
    content: |
      pub fn greet() {
          println!("NAME utility running");
      }

  - path: src/data/README.md
    content: |
      # DATA for NAME
      Generated by filz at CREATED

  - path: docs/index.md
    content: |
      # NAME Documentation
      Project type: TYPE
      Stack: STACK

  - path: docs/reference/architecture.md
    content: |
      ## Architecture
      This project has a deep nested structure to demonstrate template capabilities.

  - path: configs/production/config.yaml
    content: |
      app:
        name: NAME
        stack: STACK
        created: CREATED

  - path: configs/development/config.yaml
    content: |
      app:
        name: NAME
        type: TYPE
        created: CREATED

  - path: scripts/deploy/run.sh
    content: |
      #!/usr/bin/env bash
      echo "Deploying NAME..."

  - path: README.md
    content: |
      # NAME
      Type: TYPE
      Stack: STACK
      Created: CREATED

  - path: meta.json
    content: |
      {
        "name": "NAME",
        "type": "TYPE",
        "stack": "STACK",
        "created": "CREATED"
      }
