name: python-service
description: สร้าง Python service พร้อม virtualenv, source, tests, และ docs
type: work
stack: python

folders:
  - src
  - src/api
  - src/api/routes
  - tests
  - docs
  - configs

files:
  - path: src/api/__init__.py
    content: |
      from .routes import hello

  - path: src/api/routes/hello.py
    content: |
      def hello():
          return "Hello from NAME"

  - path: src/main.py
    content: |
      from api.routes.hello import hello

      def main():
          print(hello())

      if __name__ == '__main__':
          main()

  - path: tests/test_api.py
    content: |
      from api.routes.hello import hello

      def test_hello():
          assert hello() == "Hello from NAME"

  - path: docs/README.md
    content: |
      # NAME
      Python service with docs and tests.

  - path: configs/filz.yaml
    content: |
      app:
        name: NAME
        type: TYPE
        stack: STACK
        created: CREATED

  - path: README.md
    content: |
      # NAME
      Python service generated by filz

  - path: meta.json
    content: |
      {
        "name": "NAME",
        "type": "TYPE",
        "stack": "STACK",
        "created": "CREATED"
      }
