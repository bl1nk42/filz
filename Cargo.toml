[package]
name = "file-cli"
version = "1.7.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
serde_yaml = "0.9"
audit = "0.7.3"
zip = "0.6"
tar = "0.4"
flate2 = "1"

[build-dependencies]
prost-build = "0.13"
